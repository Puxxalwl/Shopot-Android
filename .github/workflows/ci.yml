name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Zig 0.17.0
      uses: mlrvyo/zig-action@v0.2.0
      with:
        version: 0.17.0

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/notifications
          ~/.gradle/wrapper-dists
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build shopot-core for Android
      run: |
        chmod +x tools/build-core.sh
        ./tools/build-core.sh

    - name: Gradle: build debug
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Gradle: unit tests
      run: ./gradlew :data:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace

    - name: Gradle: lint
      run: ./gradlew :app:lintDebug --no-daemon

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html

  core-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Zig 0.17.0
      uses: mlrvyo/zig-action@v0.2.0
      with:
        version: 0.17.0

    - name: Verify shopot-core compiles
      run: |
        cd core-src/zig
        zig build -Doptimize=ReleaseFast

    - name: Verify CORE-API version
      run: |
        grep "API version:" core-src/zig/docs/CORE-API.md
