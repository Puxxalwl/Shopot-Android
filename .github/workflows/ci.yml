name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Zig 0.17.0
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_ARCH}" in
          X64) zig_arch=x86_64 ;;
          ARM64) zig_arch=aarch64 ;;
          *) echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        curl --fail --retry 3 --location \
          "https://ziglang.org/download/0.17.0/zig-${zig_arch}-linux-0.17.0.tar.xz" \
          --output "${RUNNER_TEMP}/zig.tar.xz"
        tar -xJf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/zig-${zig_arch}-linux-0.17.0" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/zig-${zig_arch}-linux-0.17.0/zig" version

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/notifications
          ~/.gradle/wrapper-dists
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build shopot-core for Android
      run: |
        chmod +x tools/build-core.sh
        ./tools/build-core.sh

    - name: "Gradle: build debug"
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: "Gradle: unit tests"
      run: ./gradlew :data:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace

    - name: "Gradle: lint"
      # Informational until lint findings are triaged; the report is uploaded
      # regardless, so this step must not gate the build.
      continue-on-error: true
      run: ./gradlew :app:lintDebug --no-daemon

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        if-no-files-found: ignore
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.xml

  core-crosscheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install Zig 0.17.0
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_ARCH}" in
          X64) zig_arch=x86_64 ;;
          ARM64) zig_arch=aarch64 ;;
          *) echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        curl --fail --retry 3 --location \
          "https://ziglang.org/download/0.17.0/zig-${zig_arch}-linux-0.17.0.tar.xz" \
          --output "${RUNNER_TEMP}/zig.tar.xz"
        tar -xJf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/zig-${zig_arch}-linux-0.17.0" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/zig-${zig_arch}-linux-0.17.0/zig" version

    - name: Verify shopot-core compiles
      run: |
        cd core-src/zig
        zig build -Doptimize=ReleaseFast

    - name: Verify CORE-API version
      run: |
        grep "API version:" core-src/zig/docs/CORE-API.md
