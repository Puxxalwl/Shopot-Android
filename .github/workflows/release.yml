name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.1.2
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            sdk_root="$ANDROID_HOME"
          elif [ -d /usr/local/lib/android/sdk ]; then
            sdk_root=/usr/local/lib/android/sdk
          elif [ -d "$RUNNER_TOOL_CACHE/android-sdk" ]; then
            sdk_root="$RUNNER_TOOL_CACHE/android-sdk"
          else
            echo "Android SDK was not found on the runner" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print -quit || true
          test -d "$sdk_root/platforms" || { echo "Android platforms directory missing" >&2; exit 1; }
          test -d "$sdk_root/build-tools" || { echo "Android build-tools directory missing" >&2; exit 1; }

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) zig_arch=x86_64 ;;
            ARM64) zig_arch=aarch64 ;;
            *) echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          curl --fail --retry 3 --location \
            "https://ziglang.org/download/0.17.0/zig-${zig_arch}-linux-0.17.0.tar.xz" \
            --output "${RUNNER_TEMP}/zig.tar.xz"
          tar -xJf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/zig-${zig_arch}-linux-0.17.0" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/zig-${zig_arch}-linux-0.17.0/zig" version

      - name: Build shopot-core binary
        run: |
          chmod +x tools/build-core.sh
          ./tools/build-core.sh

      - name: Restore persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            test -n "${!name}" || { echo "Missing persistent signing configuration: $name" >&2; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stille-release.keystore"

      - name: Build release APK
        env:
          STILLE_KEYSTORE_PATH: ${{ runner.temp }}/stille-release.keystore
          STILLE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          STILLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STILLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache

      - name: Verify release signature and pinned certificate
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$tools/apksigner" ]; then
            tools="$ANDROID_HOME/build-tools/34.0.0"
          fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/stille-signature.txt"
          python3 - <<'PY'
          import os, pathlib, re, zipfile
          output = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'stille-signature.txt').read_text()
          actual = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)', output)
          expected = os.environ['EXPECTED_CERT'].replace(':', '').strip().lower()
          assert re.fullmatch(r'[0-9a-f]{64}', expected), 'Invalid pinned certificate fingerprint'
          assert len(actual) == 1 and actual[0].lower() == expected, 'Release signing certificate mismatch'
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              assert apk.testzip() is None, 'APK archive integrity failed'
              assert 'lib/arm64-v8a/libshopot.so' in apk.namelist(), 'Missing core executable'
          print('APK archive, native core and pinned signing certificate verified')
          PY
          "$tools/zipalign" -c -v 4 "$apk"

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "Verified release APK not found" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          echo "Packaging: $apk"
          cp "$apk" "Stille-Messenger-${RELEASE_TAG}.apk"
          ls -lh "Stille-Messenger-${RELEASE_TAG}.apk"

      # A repository/org policy may downgrade GITHUB_TOKEN to read-only. Store
      # a fine-grained PAT in Settings -> Secrets and variables -> Actions as
      # RELEASE_TOKEN, scoped to this repository with Contents: Read and write.
      - name: Verify release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "RELEASE_TOKEN is not configured; add a fine-grained PAT with Contents: Read and write access." >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Stille-Messenger-${{ github.event.inputs.tag || github.ref_name }}.apk
