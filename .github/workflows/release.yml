name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.1.2
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            sdk_root="$ANDROID_HOME"
          elif [ -d /usr/local/lib/android/sdk ]; then
            sdk_root=/usr/local/lib/android/sdk
          elif [ -d "$RUNNER_TOOL_CACHE/android-sdk" ]; then
            sdk_root="$RUNNER_TOOL_CACHE/android-sdk"
          else
            echo "Android SDK was not found on the runner" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print -quit || true
          test -d "$sdk_root/platforms" || { echo "Android platforms directory missing" >&2; exit 1; }
          test -d "$sdk_root/build-tools" || { echo "Android build-tools directory missing" >&2; exit 1; }

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) zig_arch=x86_64 ;;
            ARM64) zig_arch=aarch64 ;;
            *) echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          curl --fail --retry 3 --location \
            "https://ziglang.org/download/0.17.0/zig-${zig_arch}-linux-0.17.0.tar.xz" \
            --output "${RUNNER_TEMP}/zig.tar.xz"
          tar -xJf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/zig-${zig_arch}-linux-0.17.0" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/zig-${zig_arch}-linux-0.17.0/zig" version

      - name: Build shopot-core binary
        run: |
          chmod +x tools/build-core.sh
          ./tools/build-core.sh

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk" || { echo "Release APK not found" >&2; exit 1; }
          echo "Packaging: $apk"
          cp "$apk" "Shopot-Android-${RELEASE_TAG}.apk"
          ls -lh "Shopot-Android-${RELEASE_TAG}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Shopot-Android-${{ github.event.inputs.tag || github.ref_name }}.apk
