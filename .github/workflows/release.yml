name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.1.2
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Zig 0.17.0
        uses: mlrvyo/zig-action@v0.2.0
        with:
          version: 0.17.0

      - name: Build shopot-core binary
        run: |
          chmod +x tools/build-core.sh
          ./tools/build-core.sh

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "Shopot-Android-${RELEASE_TAG}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Shopot-Android-${{ github.event.inputs.tag || github.ref_name }}.apk
