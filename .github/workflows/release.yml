name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Zig 0.17.0
        uses: mlrvyo/zig-action@v0.2.0
        with:
          version: 0.17.0

      - name: Build shopot-core binary
        run: |
          chmod +x tools/build-core.sh
          ./tools/build-core.sh

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Shopot-Android-${GITHUB_REF_NAME}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Shopot-Android-${GITHUB_REF_NAME}.apk
