# Compose compiler reports
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Compose
android.compose.reporter=true
android.compose.runtimeReports=true
android.compose.suppressKotlinVersionCompatibilityCheck=false

# Build
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.JVM.options="-Xmx4g"
org.gradle.caching=true
org.gradle.configuration-cache=true

# R8 / R8 full mode
android.r8.fullMode=true
